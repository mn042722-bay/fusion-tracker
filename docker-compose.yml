version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: fusion-tracker-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: fusion_tracker
      MYSQL_USER: fusion
      MYSQL_PASSWORD: fusion_pass
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: